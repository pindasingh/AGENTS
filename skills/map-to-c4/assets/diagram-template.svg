<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">{{DIAGRAM_TYPE}} — {{SCOPE_NAME}}</title>
  <desc id="diagram-description">{{DIAGRAM_DESCRIPTION}}</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .element { fill: #e0f2fe; stroke: #075985; stroke-width: 2; }
      .scope { fill: #f8fafc; stroke: #475569; stroke-width: 2; stroke-dasharray: 8 6; }
      .relationship { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
      .name { font: 700 20px sans-serif; fill: #0f172a; text-anchor: middle; }
      .meta, .label, .legend { font: 15px sans-serif; fill: #1e293b; text-anchor: middle; }
    </style>
  </defs>

  <text x="600" y="40" class="name">{{DIAGRAM_TYPE}} — {{SCOPE_NAME}}</text>

  <!-- Repeat an element group for each view element. Preserve all data attributes. -->
  <g data-c4-element-id="{{SOURCE_ID}}" data-model-element-id="{{SOURCE_MODEL_ID}}">
    <rect class="element" x="90" y="270" width="280" height="150" rx="8"/>
    <text class="name" x="230" y="315">{{SOURCE_NAME}}</text>
    <text class="meta" x="230" y="345">[{{SOURCE_TYPE}}]</text>
    <text class="meta" x="230" y="375">{{SOURCE_RESPONSIBILITY}}</text>
  </g>

  <g data-c4-element-id="{{DESTINATION_ID}}" data-model-boundary-id="{{DESTINATION_BOUNDARY_ID}}">
    <rect class="element" x="830" y="270" width="280" height="150" rx="8"/>
    <text class="name" x="970" y="315">{{DESTINATION_NAME}}</text>
    <text class="meta" x="970" y="345">[{{DESTINATION_TYPE}}]</text>
    <text class="meta" x="970" y="375">{{DESTINATION_RESPONSIBILITY}}</text>
  </g>

  <!-- Repeat one path and nearby label for every relationship. Route around boxes. -->
  <path class="relationship" d="M 370 345 H 830"
        data-c4-relationship-id="{{RELATIONSHIP_ID}}"
        data-source-id="{{SOURCE_ID}}"
        data-destination-id="{{DESTINATION_ID}}"
        data-label="{{RELATIONSHIP_LABEL}}"
        data-model-relationship-ids="{{MODEL_RELATIONSHIP_IDS}}"/>
  <text class="label" x="600" y="330">{{RELATIONSHIP_LABEL}}</text>

  <g aria-label="Diagram key">
    <rect x="30" y="650" width="1140" height="45" fill="#f8fafc" stroke="#94a3b8"/>
    <text class="legend" x="600" y="678">Key: {{KEY_TEXT}}</text>
  </g>
</svg>
